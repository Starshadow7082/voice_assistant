<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siva, My Virtual Assistant</title>
    <link rel="shortcut icon" href="logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="logo.jpg" alt="logo" id="logo">
    <h1>I'm <span id="name">Siva</span>, Your <span id="va">Virtual Voice Assistant</span></h1>
    <img src="voice.jpg" alt="voice" id="voice">
    
    <!-- User input for city -->
    <div>
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button id="getWeatherBtn">Get Weather</button>
    </div>

    <div id="weatherReport">
        <!-- Weather report will be displayed here -->
    </div>

    <button id="btn"><img src="mic.svg" alt="mic"> <span id="content">Click here to talk to me</span></button>

    <script src="script.js"></script>
</body>
</html>
